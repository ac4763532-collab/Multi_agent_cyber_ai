services:
  # ============================================================================
  # 1. PostgreSQL 16 Relational Persistence
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cyber_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cyber_network

  # ============================================================================
  # 2. Redis 7 Cache, Rate Limiting & Ephemeral State
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: cyber_ai_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./infrastructure/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cyber_network

  # ============================================================================
  # 3. Redpanda (Kafka-compatible message broker)
  # ============================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: cyber_ai_redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:[[:space:]]*true'"]
      interval: 5s
      timeout: 8s
      retries: 20
      start_period: 20s
    networks:
      - cyber_network

  # ============================================================================
  # 4. Redpanda Topic Provisioner (ephemeral)
  # ============================================================================
  redpanda-init-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: cyber_ai_init_topics
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./infrastructure/docker/redpanda/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/sh", "/init-topics.sh"]
    environment:
      KAFKA_BROKER: redpanda:9092
    networks:
      - cyber_network

  # ============================================================================
  # 5. FastAPI Backend API Gateway
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyber_ai_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init-topics:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./configs:/app/configs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)\""]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 25s
    networks:
      - cyber_network

  # ============================================================================
  # 6. React SOC Analyst Web Console
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cyber_ai_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cyber_network

networks:
  cyber_network:
    name: cyber_network
    driver: bridge

volumes:
  postgres_data:
    name: cyber_ai_postgres_data
  redis_data:
    name: cyber_ai_redis_data
  redpanda_data:
    name: cyber_ai_redpanda_data
