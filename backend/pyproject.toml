[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-cyber-ai-backend"
version = "0.1.0"
description = "AI-Driven Multi-Agent Real-Time Cybersecurity Threat Detection and Correlation"
readme = "../README.md"
requires-python = ">=3.11"
authors = [
    { name = "Cyber Security Engineering Team" }
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security checks)
]
ignore = [
    "S101",   # Use of assert (needed in tests)
    "S104",   # Possible binding to all interfaces (0.0.0.0 in dev server)
    "S105",   # Possible hardcoded password (for default env config template)
    "B008",   # Do not perform function calls in argument defaults (FastAPI Depends)
    "S106",   # Possible hardcoded password
    "ASYNC109", # Async timeout check
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
